name = "proyecto-concejales"
type = "javascript"
account_id = "08f88499cb93d6c0eb07e6d85e1d2b01"
workers_dev = false

[env.production]
name = "proyecto-concejales"
routes = []
zone_id = ""

[build]
command = "cd frontend && npm install --legacy-peer-deps && npm run build"
cwd = "."
watch_paths = ["frontend/**/*.tsx", "frontend/**/*.ts", "frontend/**/*.css"]

[build.upload]
format = "service-worker"
main = "./dist/index.html"

[[build.upload.rules]]
type = "CompiledContentType"
globs = ["**/*.wasm"]
fallthrough = true

[[build.upload.rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.js", "**/*.json"]
fallthrough = false
