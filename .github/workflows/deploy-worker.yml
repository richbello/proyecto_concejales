name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'backend/licencias-worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy Worker
        run: |
          cd backend/licencias-worker
          npm install -g wrangler
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
